<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Search Results</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/search.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="Sleep Outside logo" />
        <a href="/">Sleep<span class="highlight">Outside</span></a>
      </div>

      <form id="search-form" class="search-form">
        <input
          type="search"
          id="search-input"
          name="search"
          placeholder="Search products..."
          aria-label="Search products"
          required
        />
        <button type="submit">Search</button>
      </form>

      <div class="cart">
        <a href="/cart/index.html">Cart</a>
      </div>
    </header>

    <main class="divider">
      <h1>Search Results</h1>
      <p id="search-message" aria-live="polite"></p>
      <ul class="product-list"></ul>
    </main>
  </body>
</html>
